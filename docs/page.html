<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page &ndash; art-crit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">art-crit</a>
  <span class="crumb">/ <a href="index.html">prompts</a></span>
</header>
<main class="container" id="main">
  <div class="page-head">
    <h1 id="title">Loading&hellip;</h1>
    <div class="page-meta" id="page-meta"></div>
    <section class="prompt-box" id="prompt-box" hidden>
      <div class="prompt-label">Prompt</div>
      <div class="prompt-text" id="prompt"></div>
    </section>
    <details class="final-prompt" id="final-prompt-box" hidden>
      <summary>Final prompt <span class="muted">&mdash; the full brief each run received</span></summary>
      <div class="prompt-text" id="final-prompt"></div>
    </details>
    <div class="highlights" id="highlights" hidden></div>
  </div>

  <section class="section" id="runs-section">
    <div class="section-head">
      <h2>Runs</h2>
      <span class="count" id="runs-count"></span>
      <span class="spacer"></span>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" class="chip" data-view="grid">Grid</button>
        <button type="button" class="chip" data-view="table">Table</button>
      </div>
      <button id="play-all" class="btn" type="button" hidden title="Each game runs in its own sandbox and downloads its own copy of the engine (about 38 MB for Godot), so starting many at once downloads a lot.">&#9654; Play all</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter runs" hidden></div>
    <div id="grid" class="run-grid" hidden></div>
    <div class="table-wrap" id="table-wrap">
      <table class="runs" id="runs-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<div class="select-bar" id="select-bar" role="region" aria-label="Selected runs" hidden>
  <span id="select-count"></span>
  <a id="compare-selected" class="btn" href="#">Compare</a>
  <button id="select-clear" class="btn btn-secondary" type="button">Clear</button>
</div>
<script type="module" src="assets/page.js"></script>
</body>
</html>
