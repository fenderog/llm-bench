  <span class="crumb">/ <a href="index.html">pages</a></span>
</header>
<main class="container" id="main">
  <h1 id="title">Loading&hellip;</h1>
  <section class="prompt-box" id="prompt-box" hidden>
    <div class="prompt-label">Prompt</div>

    <summary>Final prompt <span class="muted">&mdash; the brief the main agent sent to each run</span></summary>
    <div class="prompt-text" id="final-prompt"></div>
  </details>

  <h2>Runs</h2>
  <div class="toolbar-row">
    <a id="compare-all" class="btn" href="#">Compare all</a>
  </div>
  <div class="table-wrap">
    <table class="runs" id="runs-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
