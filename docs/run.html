<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run &ndash; llm-bench</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">llm-bench</a>
  <span class="crumb">/ <a id="page-link" href="index.html">page</a> / run</span>
</header>
<main class="container" id="main">
  <div class="run-header">
    <div class="eyebrow" id="run-provider"></div>
    <h1 id="title">Loading&hellip;</h1>
  </div>
  <nav class="run-switcher" id="run-switcher" aria-label="Other runs of this prompt" hidden></nav>
  <div class="metric-strip" id="metric-strip"></div>

  <div class="tabs" id="tabs" role="tablist">
    <button data-tab="game" class="active" type="button" role="tab">Game</button>
    <button data-tab="transcript" type="button" role="tab">Transcript</button>
    <button data-tab="source" type="button" role="tab">Source</button>
    <button data-tab="metrics" type="button" role="tab">Metrics</button>
  </div>

  <section class="tab-panel" id="panel-game"></section>
  <section class="tab-panel" id="panel-transcript" hidden></section>
  <section class="tab-panel" id="panel-source" hidden></section>
  <section class="tab-panel" id="panel-metrics" hidden></section>
</main>
<script type="module" src="assets/run.js"></script>
</body>
</html>
