<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Armed &amp; Seated</title>
<desc id="desc">A sly, orange upholstered armchair with wooden legs extends one of its arms to hold a dark pistol, in a retro illustrated poster.</desc>
