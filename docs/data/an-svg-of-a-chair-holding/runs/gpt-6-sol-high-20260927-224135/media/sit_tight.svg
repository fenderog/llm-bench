  <clipPath id="backclip"><path d="M372 382 C305 371 277 415 293 492 L331 782 Q542 846 786 782 L821 486 C832 405 792 365 723 379 Q553 399 372 382Z"/></clipPath>
  <clipPath id="seatclip"><path d="M368 836 Q556 805 783 835 L840 896 Q856 954 788 984 Q571 1030 361 988 Q300 967 312 908Z"/></clipPath>
  <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
</defs>

