<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-label="A wry retro poster of a red upholstered armchair with an arm holding a revolver, captioned Sit Tight.">
<defs>
  <linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#f7edcf"/><stop offset="1" stop-color="#e6d2a7"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#f8df9c"/><stop offset=".72" stop-color="#efc780"/><stop offset="1" stop-color="#dba869"/></radialGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d97c49"/><stop offset=".43" stop-color="#bc502f"/><stop offset="1" stop-color="#85352d"/></linearGradient>
  <linearGradient id="cushion" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ea9251"/><stop offset=".48" stop-color="#cb6139"/><stop offset="1" stop-color="#a7422e"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#b57643"/><stop offset=".5" stop-color="#85503b"/><stop offset="1" stop-color="#572f32"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#839a94"/><stop offset=".45" stop-color="#475f65"/><stop offset="1" stop-color="#243c48"/></linearGradient>
  <pattern id="specks" width="43" height="43" patternUnits="userSpaceOnUse"><circle cx="3" cy="7" r="1.3" fill="#31434a" opacity=".24"/><circle cx="28" cy="33" r=".9" fill="#31434a" opacity=".22"/><circle cx="35" cy="13" r=".7" fill="#31434a" opacity=".19"/></pattern>
