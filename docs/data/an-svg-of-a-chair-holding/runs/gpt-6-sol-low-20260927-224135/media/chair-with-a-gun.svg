<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="An anthropomorphic golden upholstered chair holding a small revolver in its outstretched wooden arm">
<defs>
  <radialGradient id="bg"><stop stop-color="#28434b"/><stop offset="1" stop-color="#101e2b"/></radialGradient>
  <linearGradient id="gold" x2=".9" y2="1"><stop stop-color="#ffe6a3"/><stop offset=".46" stop-color="#dfaa57"/><stop offset="1" stop-color="#985a32"/></linearGradient>
  <linearGradient id="wood" x2="1" y2=".8"><stop stop-color="#c47a3f"/><stop offset=".5" stop-color="#834426"/><stop offset="1" stop-color="#4c2d27"/></linearGradient>
  <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#aabcc0"/><stop offset=".42" stop-color="#4d6971"/><stop offset="1" stop-color="#263842"/></linearGradient>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#ffe8b5" opacity=".2"/></pattern>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
