<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Sit Tight — the armed chair</title>
<desc id="desc">A red velvet wooden chair with a sly face raises one carved arm, its white-gloved hand gripping a steel revolver, against a golden spotlight on a midnight-blue vintage poster.</desc>
<defs>
