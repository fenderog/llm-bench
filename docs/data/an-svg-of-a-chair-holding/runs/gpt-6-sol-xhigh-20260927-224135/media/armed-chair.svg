  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0b875"/><stop offset=".28" stop-color="#c77a48"/><stop offset=".65" stop-color="#9b4a35"/><stop offset="1" stop-color="#633b35"/></linearGradient>
