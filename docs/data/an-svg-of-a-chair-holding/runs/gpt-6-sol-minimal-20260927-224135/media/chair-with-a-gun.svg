 <!-- grip clutched by hand behind weapon -->
 <path d="M28 110 Q-1 108 -11 132 Q-19 151 4 164 L62 184 Q90 187 92 160 L83 122Z" fill="#eb9b66" stroke="#263b45" stroke-width="10"/>
 <path d="M-3 132 Q18 116 49 137 M0 155 Q28 139 55 159" fill="none" stroke="#a7503d" stroke-width="7" stroke-linecap="round"/>
 <!-- gun grip -->
 <path d="M79 104 L122 127 L92 207 Q84 222 70 214 L42 198 Q33 192 41 178Z" fill="#855543" stroke="#263b45" stroke-width="10" stroke-linejoin="round"/>
 <path d="M69 179 L80 185 M79 161 L92 168 M91 144 L102 151" stroke="#d29964" stroke-width="5"/>
 <!-- trigger guard -->
 <path d="M123 108 Q155 135 127 159 Q107 174 88 148" fill="none" stroke="#263b45" stroke-width="9"/>
 <!-- frame -->
 <path d="M79 63 L171 64 L186 86 L159 119 L111 124 L77 108Z" fill="#53666a" stroke="#263b45" stroke-width="10" stroke-linejoin="round"/>
 <!-- cylinder -->
 <rect x="115" y="55" width="48" height="61" rx="13" fill="#82938f" stroke="#263b45" stroke-width="9"/>
 <circle cx="139" cy="84" r="11" fill="#4e6469" stroke="#263b45" stroke-width="5"/>
 <circle cx="139" cy="84" r="3" fill="#d6d3b5"/>
 <!-- barrel -->
 <path d="M162 55 L293 55 Q303 56 304 67 L304 87 Q303 97 292 98 L166 98Z" fill="#66797a" stroke="#263b45" stroke-width="10" stroke-linejoin="round"/>
 <path d="M190 69 H278" stroke="#c7c7aa" stroke-width="6" stroke-linecap="round"/>
 <path d="M298 60 L312 61 L312 91 L298 93" fill="#445c60" stroke="#263b45" stroke-width="7"/>
 <path d="M186 54 L193 42 L223 42 L227 54" fill="#53666a" stroke="#263b45" stroke-width="7" stroke-linejoin="round"/>
 <!-- hammer -->
 <path d="M83 66 Q65 40 53 44 L60 32 Q84 27 101 63" fill="#53666a" stroke="#263b45" stroke-width="8" stroke-linejoin="round"/>
 <!-- fingers curling around grip -->
 <path d="M41 139 Q63 124 85 143 M43 161 Q65 148 79 164 M48 181 Q65 170 74 184" fill="none" stroke="#263b45" stroke-width="8" stroke-linecap="round"/>
 </g>
<!-- small graphic muzzle sparkle -->
<g transform="translate(1166 361)" stroke="#c67949" stroke-width="5" stroke-linecap="round"><path d="M0 -23 V-39 M0 23 V39 M-23 0 H-38 M-14 -14 L-26 -26 M-14 14 L-26 26"/></g>
<!-- framing typography -->
<text x="80" y="92" fill="#263b45" font-family="Georgia,serif" font-size="36" letter-spacing="7">SEATED &amp; DANGEROUS</text>
<path d="M80 108 H1120" stroke="#263b45" stroke-width="3"/>
<text x="80" y="1122" fill="#263b45" font-family="Georgia,serif" font-style="italic" font-size="26" letter-spacing="2">TAKE A SEAT.  MAKE A STAND.</text>
<text x="1060" y="1122" fill="#263b45" font-family="Georgia,serif" font-size="25">01 / 01</text>
</svg>
