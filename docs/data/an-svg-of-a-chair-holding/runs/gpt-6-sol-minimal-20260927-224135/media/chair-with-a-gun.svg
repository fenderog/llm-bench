<path d="M276 690 Q302 735 355 733 L703 721 Q754 720 771 684" fill="none" stroke="#9d483a" stroke-width="8"/>
<path d="M326 600 Q427 576 564 588" fill="none" stroke="#ffd09a" stroke-width="8" opacity=".6" stroke-linecap="round"/>
<!-- outstretched chair arm -->
<path d="M668 594 Q708 565 745 583 L832 628 L887 558 L926 591 L858 693 Q843 715 817 707 L716 674 Q688 669 664 651Z" fill="#b4533d" stroke="#263b45" stroke-width="14" stroke-linejoin="round"/>
<path d="M749 604 L825 652" fill="none" stroke="#ef9b65" stroke-width="11" stroke-linecap="round"/>
<circle cx="692" cy="618" r="17" fill="#e99b68" stroke="#263b45" stroke-width="8"/>
<!-- revolver pointing upward to the right -->
