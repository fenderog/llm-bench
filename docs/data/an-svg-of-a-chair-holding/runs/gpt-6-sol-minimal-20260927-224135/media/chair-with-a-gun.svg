<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
<title>Chair with a gun</title>
<desc>A cheeky mid-century lounge chair takes a dramatic detective pose, gripping a small revolver.</desc>
<defs>
  <pattern id="grain" width="92" height="92" patternUnits="userSpaceOnUse"><circle cx="9" cy="20" r="1.2" fill="#263b45" opacity=".14"/><circle cx="59" cy="72" r="1" fill="#263b45" opacity=".11"/><circle cx="75" cy="13" r="1.5" fill="#263b45" opacity=".12"/><circle cx="29" cy="64" r=".9" fill="#263b45" opacity=".1"/></pattern>
  <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f6eddb"/><stop offset="1" stop-color="#e8d5b7"/></linearGradient>
  <linearGradient id="upholstery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e88352"/><stop offset=".52" stop-color="#cc603f"/><stop offset="1" stop-color="#aa493b"/></linearGradient>
  <linearGradient id="seat" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#f4a46d"/><stop offset=".5" stop-color="#d7754d"/><stop offset="1" stop-color="#b8513b"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="1200" fill="url(#wall)"/>
<rect width="1200" height="1200" fill="url(#grain)"/>
<circle cx="609" cy="529" r="408" fill="#e5cba4" opacity=".55"/>
<circle cx="609" cy="529" r="372" fill="none" stroke="#cfae85" stroke-width="2" opacity=".55"/>
<path d="M0 936 H1200" stroke="#b99672" stroke-width="3"/>
<ellipse cx="595" cy="1016" rx="430" ry="34" fill="#8c6a50" opacity=".22" filter="url(#shadow)"/>
<!-- atmospheric little stars -->
<g fill="#ad693f" opacity=".72"><path d="M938 242 l8 21 21 8-21 8-8 21-8-21-21-8 21-8z"/><path d="M244 244 l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><circle cx="1012" cy="488" r="4"/><circle cx="163" cy="604" r="5"/></g>
<!-- chair legs behind body -->
<g stroke="#263b45" stroke-width="12" stroke-linejoin="round">
 <path d="M326 730 L288 1003 Q285 1020 307 1024 L336 1022 Q348 1019 350 1005 L421 752Z" fill="#82503c"/>
 <path d="M696 738 L799 1005 Q804 1020 822 1020 L850 1015 Q862 1010 856 994 L791 717Z" fill="#82503c"/>
 <path d="M302 985 L349 988 M798 987 L846 981" stroke="#e9ae6b" stroke-width="12"/>
</g>
<!-- back chair frame -->
