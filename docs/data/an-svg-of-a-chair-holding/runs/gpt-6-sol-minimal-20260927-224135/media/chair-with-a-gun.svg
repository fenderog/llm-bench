<path d="M328 219 Q330 191 362 189 Q476 170 551 210" fill="none" stroke="#ffbf86" stroke-width="9" stroke-linecap="round" opacity=".65"/>
<path d="M556 244 L541 522 Q538 544 511 550" fill="none" stroke="#8d3d36" stroke-width="8" opacity=".5"/>
<!-- button tufting -->
<g fill="#8f443a" stroke="#f0a06c" stroke-width="4"><circle cx="365" cy="317" r="8"/><circle cx="508" cy="331" r="8"/><circle cx="361" cy="478" r="8"/><circle cx="501" cy="481" r="8"/></g>
<g stroke="#ad523f" stroke-width="3" opacity=".55"><path d="M368 326 Q388 395 363 469 M500 340 Q478 398 498 473 M374 312 Q444 331 500 330 M368 481 Q426 462 492 480" fill="none"/></g>
<!-- expressive face -->
<path d="M334 373 Q363 356 388 371 M453 370 Q484 355 515 367" fill="none" stroke="#263b45" stroke-width="10" stroke-linecap="round"/>
<ellipse cx="365" cy="392" rx="9" ry="13" fill="#263b45"/><ellipse cx="481" cy="389" rx="9" ry="13" fill="#263b45"/>
<path d="M397 447 Q432 464 461 440" fill="none" stroke="#263b45" stroke-width="8" stroke-linecap="round"/>
<!-- back support posts -->
<path d="M278 544 L275 732 M586 541 L608 712" stroke="#263b45" stroke-width="20" stroke-linecap="round"/>
<!-- left chair arm, hand relaxed -->
<path d="M276 576 Q218 571 212 625 Q204 680 251 704 L337 740 L366 677 L289 645Z" fill="#a54d3b" stroke="#263b45" stroke-width="13" stroke-linejoin="round"/>
<path d="M254 601 Q231 618 245 647" fill="none" stroke="#e99365" stroke-width="10" stroke-linecap="round"/>
<!-- seat cushion -->
