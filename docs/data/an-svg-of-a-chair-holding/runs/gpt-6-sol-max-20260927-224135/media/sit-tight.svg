  <!-- Lettering. -->
  <g text-anchor="middle" fill="#263A39">
    <text x="600" y="127" font-family="Avenir Next Condensed, Avenir, sans-serif" font-size="24" font-weight="800" letter-spacing="8">A ONE-SEAT WESTERN</text>
    <text x="600" y="266" font-family="Impact, Arial Black, sans-serif" font-size="150" letter-spacing="3">SIT TIGHT.</text>
    <text x="600" y="313" font-family="Avenir Next Condensed, Avenir, sans-serif" font-size="24" font-weight="800" letter-spacing="5.2">THIS CHAIR HAS THE FLOOR</text>
  </g>
