<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Sit Tight — a chair holding a revolver</title>
  <desc id="desc">A mischievous red upholstered armchair, wearing a cowboy hat, holds a large old-fashioned revolver in a gloved hand. A warm, retro western poster.</desc>
  <defs>
    <pattern id="paper" width="39" height="37" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r="1.3" fill="#986E4E" opacity=".16"/>
      <circle cx="28" cy="19" r=".9" fill="#986E4E" opacity=".14"/>
      <path d="M16 32h3M34 3h2" stroke="#986E4E" opacity=".14" stroke-width="1.5"/>
    </pattern>
    <pattern id="weave" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(29)">
      <path d="M0 0v13" stroke="#F2A174" stroke-width="2" opacity=".18"/>
    </pattern>
    <clipPath id="sun"><circle cx="595" cy="785" r="429"/></clipPath>
    <g id="star"><path d="M0-13 3.6-3.6 13 0 3.6 3.6 0 13-3.6 3.6-13 0-3.6-3.6Z"/></g>
  </defs>

