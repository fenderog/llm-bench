<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">Coast &amp; Roll</title>
  <desc id="desc">A windswept white pelican with an enormous golden bill and a coral scarf cruises on a teal skateboard with orange wheels. A warm sun, sea-green waves and little shore plants form a cheerful coastal backdrop.</desc>
