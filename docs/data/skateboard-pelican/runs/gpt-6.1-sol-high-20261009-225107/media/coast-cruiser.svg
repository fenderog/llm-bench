      <circle cx="8" cy="13" r=".8" fill="#b9a88a" opacity=".25"/>
      <circle cx="32" cy="35" r=".65" fill="#b9a88a" opacity=".22"/>
    </pattern>
    <pattern id="grip" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="3" cy="3" r="1.1" fill="#fff1cd" opacity=".35"/>
    </pattern>
