<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Coast Cruiser — a pelican on a skateboard</title>
  <desc id="desc">A cheerful ivory pelican wearing a sea-green helmet spreads a wing as it rides an orange skateboard. Its enormous golden bill catches the sun, against a warm cream coastal backdrop.</desc>
