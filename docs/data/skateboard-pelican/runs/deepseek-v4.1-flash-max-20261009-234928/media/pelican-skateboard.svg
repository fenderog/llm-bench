      <stop offset="0.62" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#d7dee4"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#ef8b1e"/>
