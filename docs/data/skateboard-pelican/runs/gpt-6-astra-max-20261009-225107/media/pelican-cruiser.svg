    <clipPath id="bird-clip"><use href="#bird-shape"/></clipPath>
    <path id="wing-shape" d="M677 640 C632 661 567 635 517 603 C457 563 417 518 383 478 C339 462 301 441 273 411 C264 400 273 390 286 397 L325 420 C289 381 263 344 250 309 C245 295 257 286 268 300 L309 344 C287 301 275 260 277 226 C278 210 292 207 299 224 C323 270 354 305 396 337 C443 372 475 402 503 439 C557 452 612 474 653 507 C688 535 706 565 705 593 C705 614 695 632 677 640 Z"/>
