<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title description">
  <title id="title">Coastal Cruiser</title>
  <desc id="description">A jaunty white pelican balances on a coral skateboard, one black-tipped wing lifted into the sea breeze. Its enormous golden bill points down the coast, against a mint-green ocean and an apricot sun. Original vector illustration in warm, screen-printed colors.</desc>
  <defs>
    <pattern id="paper" width="54" height="47" patternUnits="userSpaceOnUse">
      <g fill="#967f61" opacity=".10">
        <circle cx="4" cy="7" r=".7"/><circle cx="28" cy="12" r=".8"/><circle cx="46" cy="35" r=".65"/>
        <circle cx="13" cy="39" r=".65"/><circle cx="35" cy="28" r=".5"/><circle cx="21" cy="25" r=".5"/>
      </g>
    </pattern>
