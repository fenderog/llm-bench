<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="0.55" stop-color="#cdeefd"/>
      <stop offset="1" stop-color="#f3fbff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f1f5f8"/>
      <stop offset="1" stop-color="#d6e0e8"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffca5f"/>
      <stop offset="1" stop-color="#f7971e"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc44d"/>
      <stop offset="1" stop-color="#ff9c1a"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a5a"/>
      <stop offset="1" stop-color="#1d2630"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7b4"/>
      <stop offset="1" stop-color="#6d7a88"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="760" cy="110" r="120" fill="url(#sunGlow)"/>
  <circle cx="760" cy="110" r="46" fill="#ffe680"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="170" cy="120" rx="62" ry="30"/>
      <ellipse cx="220" cy="105" rx="48" ry="34"/>
      <ellipse cx="120" cy="128" rx="44" ry="24"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="560" cy="80" rx="54" ry="24"/>
      <ellipse cx="605" cy="70" rx="40" ry="26"/>
      <ellipse cx="518" cy="86" rx="36" ry="18"/>
    </g>
  </g>

  <!-- ground/road -->
  <rect x="0" y="500" width="900" height="100" fill="url(#road)"/>
  <rect x="0" y="496" width="900" height="8" fill="#b9c4cf"/>
  <!-- road dashes -->
  <g fill="#f2f5f8" opacity="0.85">
    <rect x="40" y="552" width="90" height="10" rx="5"/>
    <rect x="190" y="552" width="90" height="10" rx="5"/>
    <rect x="340" y="552" width="90" height="10" rx="5"/>
    <rect x="490" y="552" width="90" height="10" rx="5"/>
    <rect x="640" y="552" width="90" height="10" rx="5"/>
    <rect x="790" y="552" width="90" height="10" rx="5"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="420" cy="522" rx="215" ry="22" fill="#3b4a5a" opacity="0.28"/>

  <!-- ============ SKATEBOARD ============ -->
  <g>
    <!-- trucks -->
    <rect x="288" y="466" width="26" height="20" rx="5" fill="#8b98a6"/>
    <rect x="516" y="466" width="26" height="20" rx="5" fill="#8b98a6"/>
    <!-- wheels -->
    <g>
      <circle cx="301" cy="500" r="19" fill="#263340"/>
      <circle cx="301" cy="500" r="9" fill="#f4d35e"/>
      <circle cx="301" cy="500" r="3" fill="#263340"/>
      <circle cx="529" cy="500" r="19" fill="#263340"/>
      <circle cx="529" cy="500" r="9" fill="#f4d35e"/>
      <circle cx="529" cy="500" r="3" fill="#263340"/>
    </g>
    <!-- deck -->
    <path d="M232,452
             Q248,438 272,440
             L558,440
             Q582,438 596,452
             Q582,468 558,466
             L272,466
             Q248,468 232,452 Z"
          fill="url(#deck)" stroke="#141c24" stroke-width="3" stroke-linejoin="round"/>
    <!-- deck grip stripe -->
    <path d="M255,447 L573,447" stroke="#5b6b7c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- deck art -->
    <circle cx="414" cy="453" r="11" fill="#ff5c5c"/>
    <circle cx="414" cy="453" r="5" fill="#ffe680"/>
  </g>

  <!-- motion streaks -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="430" x2="180" y2="430"/>
    <line x1="40" y1="462" x2="150" y2="462"/>
    <line x1="70" y1="494" x2="165" y2="494"/>
  </g>

  <!-- ============ PELICAN ============ -->
  <g>
    <!-- far wing raised behind -->
    <path d="M352,262
             C318,214 300,158 322,120
             C356,150 378,206 388,258
             C378,276 362,276 352,262 Z"
          fill="#dbe4ec" stroke="#c2ced9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M344,236 C336,196 334,166 340,144" stroke="#c2ced9" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M360,242 C358,208 362,178 372,156" stroke="#c2ced9" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- legs -->
    <g stroke="#f7971e" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M352,392 C348,424 350,444 352,456"/>
      <path d="M404,394 C410,424 420,444 428,456"/>
    </g>

    <!-- body -->
    <path d="M270,330
             C248,282 268,232 320,220
             C376,207 426,232 440,286
             C452,334 430,382 384,396
             C338,410 290,382 270,330 Z"
          fill="url(#body)" stroke="#c2ced9" stroke-width="3"/>
    <!-- belly shading -->
    <path d="M300,372 C340,392 396,388 424,356
             C412,388 372,404 338,398 C318,394 306,384 300,372 Z"
          fill="#dbe4ec" opacity="0.8"/>

    <!-- tail feathers -->
    <path d="M266,326 C232,318 206,326 190,344
             C214,350 232,352 252,360
             C258,348 262,336 266,326 Z"
          fill="#eef3f7" stroke="#c2ced9" stroke-width="3" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M408,272 C420,224 442,192 476,180"
          stroke="#f4f8fb" stroke-width="46" stroke-linecap="round" fill="none"/>
    <path d="M408,272 C420,224 442,192 476,180"
          stroke="#ffffff" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- near wing (balancing, sweeping back) -->
    <path d="M356,292
             C304,300 246,292 198,266
             C206,300 250,320 300,326
             C328,330 350,318 362,306
             C366,300 362,294 356,292 Z"
          fill="#eef3f7" stroke="#c2ced9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M350,300 C310,306 264,300 224,282" stroke="#c2ced9" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M352,312 C316,318 274,314 236,300" stroke="#c2ced9" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- head -->
    <circle cx="494" cy="172" r="38" fill="#f7fafc" stroke="#c2ced9" stroke-width="3"/>

    <!-- crest tuft -->
    <path d="M470,140 C460,120 466,104 480,96
             C482,114 486,128 492,138 Z"
          fill="#eef3f7" stroke="#c2ced9" stroke-width="3" stroke-linejoin="round"/>

    <!-- upper beak -->
    <path d="M518,156
             C568,148 646,158 700,178
             C648,176 566,172 520,172 Z"
          fill="url(#beak)" stroke="#e07d0a" stroke-width="3" stroke-linejoin="round"/>
    <!-- beak ridge -->
    <path d="M522,164 C574,162 644,168 692,178" stroke="#e07d0a" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- pouch -->
    <path d="M518,172
             C552,180 606,188 664,184
             C652,232 592,252 548,236
             C524,226 512,200 518,172 Z"
          fill="url(#pouch)" stroke="#e07d0a" stroke-width="3" stroke-linejoin="round"/>
    <!-- pouch highlight -->
    <path d="M540,196 C560,214 596,224 630,220" stroke="#ffdd8a" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>

    <!-- eye -->
    <circle cx="508" cy="164" r="8" fill="#ffffff"/>
    <circle cx="510" cy="164" r="5.5" fill="#22303c"/>
    <circle cx="512" cy="161" r="2" fill="#ffffff"/>

    <!-- little backwards cap -->
    <g>
      <path d="M460,146 C458,120 478,104 502,106
               C524,108 538,124 536,146
               C510,152 482,152 460,146 Z"
            fill="#ff5c5c" stroke="#d23c3c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M536,142 C558,138 574,142 582,152
               C564,160 546,158 534,152 Z"
            fill="#ff7a7a" stroke="#d23c3c" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="500" cy="108" r="5" fill="#ffd166"/>
    </g>
  </g>

  <!-- feet on deck -->
  <g fill="#f7971e" stroke="#d97c0a" stroke-width="3" stroke-linejoin="round">
    <path d="M336,452 C348,446 378,448 398,456
             C378,466 350,468 336,464
             C330,460 330,456 336,452 Z"/>
    <path d="M412,454 C424,448 454,450 474,458
             C454,468 426,470 412,466
             C406,462 406,458 412,454 Z"/>
  </g>

  <!-- speed sparkles -->
  <g fill="#ffe680">
    <path d="M150,360 l6,-14 l6,14 l-6,-6 z"/>
    <path d="M210,320 l5,-12 l5,12 l-5,-5 z"/>
    <path d="M120,392 l4,-10 l4,10 l-4,-4 z"/>
  </g>
</svg>
