<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Pelican riding a skateboard</title>
  <desc>A cartoon pelican wearing a red helmet rides a purple skateboard along a wooden boardwalk by the sea.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec9ee"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5bc6ea"/>
      <stop offset="1" stop-color="#1e88b8"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="460" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="110" cy="100" r="42" fill="#ffd54f"/>
  <path d="M 162 100 H 178 M 58 100 H 42 M 110 38 V 22 M 110 162 V 178 M 147 63 L 157 53 M 73 63 L 63 53 M 147 137 L 157 147 M 73 137 L 63 147"
        stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>

  <!-- Distant gulls -->
  <g stroke="#7fa8bd" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 305 118 q 9 -9 18 0 q 9 -9 18 0"/>
    <path d="M 362 88 q 7 -7 14 0 q 7 -7 14 0"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="615" cy="98" rx="40" ry="20"/>
    <ellipse cx="580" cy="106" rx="26" ry="14"/>
    <ellipse cx="655" cy="106" rx="28" ry="14"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="726" cy="170" rx="30" ry="14"/>
    <ellipse cx="700" cy="177" rx="18" ry="10"/>
    <ellipse cx="752" cy="177" rx="20" ry="10"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="215" cy="205" rx="26" ry="11"/>
    <ellipse cx="240" cy="211" rx="16" ry="8"/>
    <ellipse cx="193" cy="211" rx="16" ry="8"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="448" width="800" height="64" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M 30 466 Q 45 460 60 466 Q 75 472 90 466"/>
    <path d="M 150 480 Q 165 474 180 480 Q 195 486 210 480"/>
    <path d="M 620 468 Q 635 462 650 468 Q 665 474 680 468"/>
    <path d="M 700 496 Q 715 490 730 496 Q 745 502 760 496"/>
    <path d="M 90 500 Q 105 494 120 500"/>
  </g>

  <!-- Sailboat -->
  <g>
    <path d="M 654 447 L 696 447 L 688 459 L 662 459 Z" fill="#455a64"/>
    <path d="M 676 412 L 676 446 L 656 446 Z" fill="#ffffff"/>
    <path d="M 680 416 L 680 446 L 696 446 Z" fill="#e3f2fd" opacity="0.9"/>
  </g>

  <!-- Boardwalk -->
  <rect x="0" y="512" width="800" height="88" fill="#cfa06b"/>
  <rect x="0" y="512" width="800" height="7" fill="#a87a4d"/>
  <g stroke="#b5874f" stroke-width="3">
    <path d="M 0 544 H 800 M 0 576 H 800"/>
    <path d="M 95 519 V 544 M 265 519 V 544 M 435 519 V 544 M 605 519 V 544 M 775 519 V 544 M 180 544 V 576 M 350 544 V 576 M 520 544 V 576 M 690 544 V 576 M 40 576 V 600 M 210 576 V 600 M 380 576 V 600 M 550 576 V 600 M 720 576 V 600"/>
  </g>

  <!-- Shadow under the skateboard -->
  <ellipse cx="410" cy="514" rx="175" ry="8" fill="#6b4a2b" opacity="0.25"/>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M 58 428 H 186"/>
    <path d="M 34 462 H 150"/>
    <path d="M 70 496 H 198"/>
  </g>

  <!-- Dust puffs behind rear wheel -->
  <g fill="#e6d3ac" opacity="0.65">
    <circle cx="238" cy="514" r="8"/>
    <circle cx="220" cy="519" r="5"/>
    <circle cx="254" cy="517" r="4"/>
  </g>

  <!-- Skateboard -->
  <path d="M 268 452 Q 278 474 300 474 L 520 474 Q 542 474 552 452"
        fill="none" stroke="#7e57c2" stroke-width="16" stroke-linecap="round"/>
  <circle cx="330" cy="474" r="3.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="500" cy="474" r="3.5" fill="#ffffff" opacity="0.85"/>
  <rect x="303" y="480" width="20" height="10" rx="3" fill="#607d8b"/>
  <rect x="487" y="480" width="20" height="10" rx="3" fill="#607d8b"/>
  <g>
    <circle cx="313" cy="499" r="14" fill="#ffca28"/>
    <circle cx="313" cy="499" r="5" fill="#f57f17"/>
  </g>
  <g>
    <circle cx="497" cy="499" r="14" fill="#ffca28"/>
    <circle cx="497" cy="499" r="5" fill="#f57f17"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Tail feathers -->
    <g stroke="#e3d8c2" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M 316 338 Q 282 320 248 314"/>
      <path d="M 314 348 Q 278 342 242 340"/>
      <path d="M 316 358 Q 286 364 254 372"/>
    </g>

    <!-- Neck -->
    <path d="M 468 362 C 545 335 500 268 532 208"
          stroke="#fbf6ec" stroke-width="30" fill="none" stroke-linecap="round"/>

    <!-- Legs and webbed feet -->
    <g stroke="#ef9530" stroke-width="10" stroke-linecap="round">
      <path d="M 366 424 L 364 456"/>
      <path d="M 446 424 L 448 456"/>
    </g>
    <g fill="#f5a623">
      <path d="M 344 466 Q 342 452 356 448 Q 374 444 386 456 L 388 466 Z"/>
      <path d="M 424 466 Q 422 452 436 448 Q 454 444 466 456 L 468 466 Z"/>
    </g>
    <g stroke="#d97b1f" stroke-width="2.5" stroke-linecap="round">
      <path d="M 356 464 L 358 452 M 370 464 L 371 450"/>
      <path d="M 436 464 L 438 452 M 450 464 L 451 450"/>
    </g>

    <!-- Body -->
    <path d="M 320 330 Q 298 352 304 382 Q 312 416 358 428 Q 412 440 468 428 Q 510 418 514 384 Q 517 354 492 334 Q 456 312 406 312 Q 350 312 320 330 Z"
          fill="#fbf6ec"/>
    <ellipse cx="410" cy="418" rx="72" ry="15" fill="#efe4cd" opacity="0.55"/>

    <!-- Wing -->
    <path d="M 472 320 Q 370 262 272 238 Q 290 288 324 280 Q 344 296 376 288 Q 400 304 432 296 Q 448 344 478 370 Z"
          fill="#e9dfc9"/>
    <g stroke="#d6c9ad" stroke-width="3" fill="none" opacity="0.9">
      <path d="M 458 338 Q 372 300 296 252"/>
      <path d="M 466 356 Q 392 318 330 272"/>
    </g>

    <!-- Head -->
    <circle cx="530" cy="190" r="32" fill="#fbf6ec"/>
    <circle cx="549" cy="207" r="7" fill="#f4b8a0" opacity="0.7"/>

    <!-- Beak with pouch -->
    <path d="M 552 170 Q 615 180 668 194 Q 615 202 556 196 Z" fill="#fbc02d"/>
    <path d="M 556 195 Q 610 285 664 197 Q 620 212 556 208 Z" fill="#f57c00"/>
    <path d="M 556 196 Q 612 204 664 195" stroke="#e65100" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 576 178 L 598 182" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye -->
    <circle cx="543" cy="189" r="6" fill="#263238"/>
    <circle cx="545.5" cy="186.5" r="2" fill="#ffffff"/>

    <!-- Helmet -->
    <path d="M 500 176 Q 478 160 460 166" stroke="#e3d8c2" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 500 187 Q 480 178 466 180" stroke="#e3d8c2" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 495 187 A 34 34 0 0 1 563 185 Q 529 173 495 187 Z" fill="#ff5252"/>
    <path d="M 518 152 L 530 153 L 526 181 L 514 180 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="529" cy="151" r="3.5" fill="#c62828"/>
    <path d="M 561 178 L 578 173 L 580 184 L 562 187 Z" fill="#c62828"/>
    <path d="M 503 178 Q 504 160 519 154" stroke="#ffffff" stroke-width="4" opacity="0.7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
