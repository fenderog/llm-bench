<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea8e8"/>
      <stop offset="0.67" stop-color="#a9cef3"/>
      <stop offset="1" stop-color="#c8e6fa"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#606570"/>
      <stop offset="1" stop-color="#4c515b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe97a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe97a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="400" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="85" fill="url(#sunGlow)"/>
  <circle cx="690" cy="95" r="42" fill="#ffd75a"/>

  <!-- drifting clouds -->
  <g fill="#fbfdff" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -900 0" dur="75s" repeatCount="indefinite"/>
      <ellipse cx="170" cy="112" rx="58" ry="26"/>
      <ellipse cx="128" cy="122" rx="40" ry="20"/>
      <ellipse cx="216" cy="122" rx="44" ry="20"/>
      <ellipse cx="430" cy="78" rx="48" ry="22"/>
      <ellipse cx="398" cy="86" rx="32" ry="16"/>
      <ellipse cx="466" cy="86" rx="34" ry="16"/>
      <ellipse cx="300" cy="200" rx="40" ry="18"/>
      <ellipse cx="272" cy="207" rx="26" ry="13"/>
      <ellipse cx="330" cy="207" rx="28" ry="13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="900 0; 0 0" dur="75s" repeatCount="indefinite"/>
      <ellipse cx="170" cy="112" rx="58" ry="26"/>
      <ellipse cx="128" cy="122" rx="40" ry="20"/>
      <ellipse cx="216" cy="122" rx="44" ry="20"/>
      <ellipse cx="430" cy="78" rx="48" ry="22"/>
      <ellipse cx="398" cy="86" rx="32" ry="16"/>
      <ellipse cx="466" cy="86" rx="34" ry="16"/>
      <ellipse cx="300" cy="200" rx="40" ry="18"/>
      <ellipse cx="272" cy="207" rx="26" ry="13"/>
      <ellipse cx="330" cy="207" rx="28" ry="13"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="400" width="800" height="30" fill="#6fb45a"/>
  <rect x="0" y="430" width="800" height="170" fill="url(#road)"/>
  <!-- scrolling lane dashes -->
  <line x1="0" y1="540" x2="1600" y2="540" stroke="#e8e2c8" stroke-width="9" stroke-dasharray="70 60">
    <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- shadow -->
  <ellipse cx="425" cy="512" rx="165" ry="11" fill="#2c3038" opacity="0.3"/>

  <!-- speed lines -->
  <g fill="#ffffff" opacity="0.55">
    <rect x="70" y="300" width="95" height="7" rx="3.5">
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="345" width="130" height="7" rx="3.5">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="95" y="388" width="80" height="7" rx="3.5">
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="0.45s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- skateboard -->
  <g>
    <rect x="335" y="470" width="20" height="14" fill="#464b55"/>
    <rect x="500" y="470" width="20" height="14" fill="#464b55"/>
    <g>
      <polygon points="545,462 572,446 582,452 545,476" fill="#6d3a92"/>
      <polygon points="295,462 268,446 258,452 295,476" fill="#6d3a92"/>
      <rect x="295" y="462" width="250" height="14" fill="#7d46aa"/>
      <rect x="295" y="462" width="250" height="4" fill="#9a63c4"/>
    </g>
    <!-- wheels -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 345 496" to="700 345 496" dur="1s" repeatCount="indefinite"/>
      <circle cx="345" cy="496" r="19" fill="#3c3e46"/>
      <circle cx="345" cy="496" r="14" fill="#facd46"/>
      <g stroke="#a8811f" stroke-width="3">
        <line x1="345" y1="484" x2="345" y2="508"/>
        <line x1="334.6" y1="502" x2="355.4" y2="490"/>
        <line x1="334.6" y1="490" x2="355.4" y2="502"/>
      </g>
      <circle cx="345" cy="496" r="4" fill="#5a5d66"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 510 496" to="700 510 496" dur="1s" repeatCount="indefinite"/>
      <circle cx="510" cy="496" r="19" fill="#3c3e46"/>
      <circle cx="510" cy="496" r="14" fill="#facd46"/>
      <g stroke="#a8811f" stroke-width="3">
        <line x1="510" y1="484" x2="510" y2="508"/>
        <line x1="499.6" y1="502" x2="520.4" y2="490"/>
        <line x1="499.6" y1="490" x2="520.4" y2="502"/>
      </g>
      <circle cx="510" cy="496" r="4" fill="#5a5d66"/>
    </g>
  </g>

  <!-- pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="0.8s" repeatCount="indefinite"/>
    <!-- legs -->
    <g stroke="#eb8c32" stroke-width="7" fill="none" stroke-linecap="round">
      <polyline points="405,375 400,425 412,461"/>
      <polyline points="455,378 452,425 464,461"/>
    </g>
    <!-- feet -->
    <polygon points="398,463 434,463 429,452" fill="#eb8c32"/>
    <polygon points="450,463 486,463 481,452" fill="#eb8c32"/>
    <!-- tail -->
    <polygon points="352,296 298,250 322,320" fill="#fafbfd"/>
    <polygon points="352,296 298,250 310,288" fill="#dde3ea"/>
    <!-- body -->
    <ellipse cx="430" cy="330" rx="95" ry="68" fill="#fafbfd" transform="rotate(10 430 330)"/>
    <!-- wing -->
    <polygon points="390,295 462,318 438,368 365,342" fill="#d0d6e0"/>
    <polygon points="402,306 452,322 436,356" fill="#c2c9d6"/>
    <!-- neck -->
    <path d="M 488 295 C 515 260, 530 200, 556 185" stroke="#fafbfd" stroke-width="38" fill="none" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="560" cy="185" r="25" fill="#fafbfd"/>
    <!-- pouch -->
    <polygon points="578,188 688,209 648,238 598,222" fill="#fcba56"/>
    <!-- upper beak -->
    <polygon points="576,170 704,197 700,207 576,188" fill="#f09628"/>
    <polygon points="700,193 716,204 702,215" fill="#d97f16"/>
    <!-- eye -->
    <circle cx="568" cy="177" r="5.5" fill="#2a2c38"/>
    <circle cx="570" cy="175" r="2" fill="#ffffff"/>
  </g>
</svg>
