<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A pelican in sunglasses riding a skateboard</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8e3"/>
      <stop offset="0.7" stop-color="#cdeffd"/>
      <stop offset="1" stop-color="#ffe8c2"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ec"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#1d6f65"/>
    </linearGradient>
  </defs>

  <!-- Sky, sun, clouds -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="650" cy="110" r="55" fill="#ffd166"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="130" cy="110" rx="60" ry="22"/>
    <ellipse cx="170" cy="98" rx="40" ry="26"/>
    <ellipse cx="100" cy="118" rx="36" ry="16"/>
    <ellipse cx="500" cy="64" rx="48" ry="16"/>
    <ellipse cx="530" cy="54" rx="30" ry="18"/>
  </g>

  <!-- Road -->
  <rect y="520" width="800" height="80" fill="#6b7280"/>
  <rect y="520" width="800" height="6" fill="#4b5563"/>
  <g fill="#f1f5f9" opacity="0.8">
    <rect x="40" y="556" width="70" height="6" rx="3"/>
    <rect x="170" y="556" width="70" height="6" rx="3"/>
    <rect x="300" y="556" width="70" height="6" rx="3"/>
    <rect x="430" y="556" width="70" height="6" rx="3"/>
    <rect x="560" y="556" width="70" height="6" rx="3"/>
    <rect x="690" y="556" width="70" height="6" rx="3"/>
  </g>

  <!-- Speed lines trailing behind the board -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="60" y1="440" x2="150" y2="440"/>
    <line x1="90" y1="470" x2="170" y2="470"/>
    <line x1="40" y1="500" x2="130" y2="500"/>
  </g>

  <!-- Wheels and trucks -->
  <g>
    <rect x="212" y="478" width="32" height="8" rx="2" fill="#b0b7c0"/>
    <rect x="200" y="488" width="56" height="4" rx="2" fill="#8d96a1"/>
    <rect x="550" y="478" width="32" height="8" rx="2" fill="#b0b7c0"/>
    <rect x="538" y="488" width="56" height="4" rx="2" fill="#8d96a1"/>
    <circle cx="228" cy="506" r="14" fill="#ffd60a" stroke="#c9a400" stroke-width="2"/>
    <circle cx="228" cy="506" r="4" fill="#333"/>
    <circle cx="566" cy="506" r="14" fill="#ffd60a" stroke="#c9a400" stroke-width="2"/>
    <circle cx="566" cy="506" r="4" fill="#333"/>
  </g>

  <!-- Skateboard deck with upturned nose and tail -->
  <path d="M 186 446 C 194 462 202 462 214 462 L 592 462 C 606 462 616 452 626 440 C 630 448 622 472 604 478 L 214 478 C 196 478 184 462 186 446 Z"
        fill="url(#deck)" stroke="#155a52" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 214 466 L 592 466" stroke="#8ad7cc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Tail feathers -->
  <path d="M 318 372 Q 252 372 214 414 Q 246 404 262 402 Q 246 426 252 440 Q 282 414 300 398 Z"
        fill="#e9eef2" stroke="#8a9bab" stroke-width="2" stroke-linejoin="round"/>

  <!-- Raised wing for balance (behind the body) -->
  <path d="M 410 300 C 360 240 290 190 220 160 C 236 180 246 192 250 206 C 262 204 272 210 276 222 C 290 222 300 232 302 244 C 316 246 326 258 326 270 C 340 274 350 290 350 310 Z"
        fill="#f0f4f7" stroke="#8a9bab" stroke-width="2" stroke-linejoin="round"/>

  <!-- Legs and feet standing on the deck -->
  <g stroke="#f77f00" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 352 380 L 334 456"/>
    <path d="M 404 384 L 420 456"/>
  </g>
  <ellipse cx="340" cy="459" rx="16" ry="4" fill="#f77f00"/>
  <ellipse cx="428" cy="459" rx="16" ry="4" fill="#f77f00"/>

  <!-- Body -->
  <ellipse cx="390" cy="340" rx="100" ry="64" transform="rotate(-25 390 340)"
           fill="url(#plumage)" stroke="#8a9bab" stroke-width="2"/>
  <path d="M 330 330 Q 370 300 420 320" fill="none" stroke="#c5ced6" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 430 300 Q 468 280 466 236" fill="none" stroke="#f3f6f8" stroke-width="40" stroke-linecap="round"/>

  <!-- Head crest -->
  <path d="M 438 196 Q 420 186 408 190 Q 424 200 436 212 Z" fill="#cfd8e0"/>

  <!-- Head -->
  <circle cx="472" cy="226" r="40" fill="url(#plumage)" stroke="#8a9bab" stroke-width="2"/>

  <!-- Bill (upper mandible and throat pouch) -->
  <path d="M 500 210 C 560 206 610 220 634 238 C 640 244 634 250 626 248 C 590 240 540 236 506 236 Z"
        fill="#ffb703" stroke="#e09f00" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 506 236 C 540 240 590 246 626 248 C 616 270 600 286 572 290 C 540 292 512 276 500 250 Z"
        fill="#ff9f1c" stroke="#e07b00" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Sunglasses -->
  <rect x="456" y="212" width="36" height="16" rx="7" fill="#1d1d1f"/>
  <path d="M 462 218 L 470 214" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
