<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<title>Pelican on a roll</title>
<desc>A cheerful ivory pelican with a long golden bill balances on a teal skateboard against a warm coastal sunset.</desc>
