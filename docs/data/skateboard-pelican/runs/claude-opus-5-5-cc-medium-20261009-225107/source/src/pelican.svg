<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="0.7" stop-color="#cdeefc"/>
      <stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf1"/>
      <stop offset="1" stop-color="#9aa6b2"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#f07b22"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2453c"/>
      <stop offset="1" stop-color="#a8231d"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="55" fill="#ffe27a"/>
  <circle cx="660" cy="110" r="75" fill="#ffe27a" opacity="0.25"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="100" rx="60" ry="20"/><ellipse cx="190" cy="85" rx="40" ry="22"/>
    <ellipse cx="470" cy="60" rx="50" ry="15"/><ellipse cx="500" cy="50" rx="30" ry="16"/>
  </g>
  <!-- distant hills -->
  <path d="M0 430 Q120 360 260 410 T540 400 T800 390 V600 H0Z" fill="#9fd48a"/>
  <!-- road -->
  <rect y="470" width="800" height="130" fill="#6d6f75"/>
  <rect y="466" width="800" height="8" fill="#c8c8c8"/>
  <g fill="#f4d35e">
    <rect x="20" y="540" width="80" height="8" rx="3"/>
    <rect x="200" y="540" width="80" height="8" rx="3"/>
    <rect x="380" y="540" width="80" height="8" rx="3"/>
    <rect x="560" y="540" width="80" height="8" rx="3"/>
    <rect x="740" y="540" width="80" height="8" rx="3"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="60" y1="260" x2="170" y2="260"/>
    <line x1="30" y1="310" x2="180" y2="310"/>
    <line x1="80" y1="360" x2="190" y2="360"/>
    <line x1="40" y1="455" x2="190" y2="455"/>
  </g>

  <!-- shadow -->
  <ellipse cx="410" cy="512" rx="170" ry="12" fill="#000" opacity="0.25"/>

  <!-- skateboard -->
  <g>
    <!-- trucks -->
    <path d="M300 470 l-12 18 h44 l-12 -18z" fill="#9aa1a9"/>
    <path d="M500 470 l-12 18 h44 l-12 -18z" fill="#9aa1a9"/>
    <!-- wheels -->
    <g fill="#f6e05e" stroke="#7a6a1a" stroke-width="3">
      <circle cx="290" cy="492" r="14"/><circle cx="330" cy="492" r="14"/>
      <circle cx="490" cy="492" r="14"/><circle cx="530" cy="492" r="14"/>
    </g>
    <g fill="#7a6a1a"><circle cx="290" cy="492" r="4"/><circle cx="330" cy="492" r="4"/><circle cx="490" cy="492" r="4"/><circle cx="530" cy="492" r="4"/></g>
    <!-- deck with kicked tail & nose -->
    <path d="M250 448 Q232 446 228 430 Q245 452 270 456 H560 Q585 452 598 432 Q596 450 575 460 Q565 470 550 470 H270 Q255 470 250 448Z" fill="#5a1410"/>
    <path d="M232 432 Q240 455 270 458 H555 Q585 455 596 434 Q592 462 556 466 H268 Q238 464 232 432Z" fill="url(#deck)"/>
    <path d="M300 462 H520" stroke="#ffd166" stroke-width="3" stroke-dasharray="14 10"/>
  </g>

  <!-- pelican -->
  <g stroke="#2b2f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs -->
    <path d="M375 380 L360 420 L370 455" fill="none" stroke="#f08a24" stroke-width="9"/>
    <path d="M440 385 L455 420 L445 455" fill="none" stroke="#f08a24" stroke-width="9"/>
    <!-- webbed feet -->
    <path d="M342 457 Q348 440 370 452 Q385 442 400 457 Z" fill="#f08a24"/>
    <path d="M420 457 Q432 442 447 452 Q468 440 478 457 Z" fill="#f08a24"/>

    <!-- tail -->
    <path d="M300 320 L248 300 L262 330 L246 350 L310 350Z" fill="#cfd6dd"/>
    <!-- body -->
    <path d="M300 320 Q300 260 380 255 Q470 250 490 300 Q505 360 440 392 Q380 410 330 385 Q295 365 300 320Z" fill="url(#body)"/>
    <!-- wing (raised a bit for balance) -->
    <path d="M330 300 Q380 255 450 280 Q430 300 445 310 Q410 315 420 330 Q385 335 395 352 Q350 350 330 300Z" fill="url(#wing)"/>
    <path d="M360 300 Q395 292 425 300 M365 318 Q390 312 410 318" fill="none" stroke="#7d8894" stroke-width="2"/>

    <!-- neck -->
    <path d="M455 290 Q445 230 470 185 Q490 150 525 160 Q545 175 530 205 Q505 245 495 300Z" fill="url(#body)"/>
    <!-- head -->
    <ellipse cx="520" cy="160" rx="34" ry="28" fill="#ffffff"/>
    <!-- crest -->
    <path d="M500 136 Q505 118 520 124 Q518 110 534 116" fill="none" stroke="#f3d55b" stroke-width="5"/>
    <!-- pouch -->
    <path d="M540 172 Q600 230 680 200 Q690 192 690 182 L548 170Z" fill="url(#pouch)"/>
    <!-- upper bill -->
    <path d="M538 152 Q620 160 700 172 Q706 178 696 184 Q620 180 540 176Z" fill="#ffcf4a"/>
    <path d="M700 172 q12 4 4 14 q-4 -6 -8 -2z" fill="#e0662a"/>
    <!-- eye -->
    <circle cx="526" cy="152" r="8" fill="#fff"/>
    <circle cx="528" cy="152" r="4.5" fill="#1b1d22" stroke="none"/>
    <circle cx="529.5" cy="150.5" r="1.5" fill="#fff" stroke="none"/>
    <path d="M515 140 Q526 135 538 143" fill="none" stroke-width="3"/>
  </g>

  <!-- dust puffs behind wheels -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="245" cy="495" r="8"/><circle cx="225" cy="490" r="6"/><circle cx="208" cy="497" r="4"/>
  </g>
</svg>
