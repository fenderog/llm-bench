<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <title>Coastal Cruiser — a pelican riding a skateboard</title>
  <desc>A jaunty white pelican with a long coral bill balances on a teal skateboard, against a sunny cream coastal poster background.</desc>
  <defs>
    <pattern id="grain" width="37" height="41" patternUnits="userSpaceOnUse"><circle cx="4" cy="9" r=".8" fill="#193c46" opacity=".07"/><circle cx="26" cy="31" r=".7" fill="#193c46" opacity=".06"/></pattern>
    <pattern id="grip" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#fff0cc" opacity=".35"/></pattern>
  </defs>
  <rect width="1000" height="1000" fill="#f6edda"/>
  <rect x="28" y="28" width="944" height="944" rx="24" fill="none" stroke="#203f48" stroke-width="2"/>
  <g fill="#203f48" font-family="Arial, Helvetica, sans-serif">
    <text x="66" y="91" font-size="17" font-weight="700" letter-spacing="5">THE GOOD LIFE / VOL. 01</text>
    <text x="64" y="181" font-size="78" font-weight="900" letter-spacing="-4">COASTAL CRUISER</text>
    <text x="68" y="219" font-size="18" letter-spacing="4">LESS FLAPPING. MORE ROLLING.</text>
  </g>
  <circle cx="666" cy="477" r="209" fill="#efb94f"/>
