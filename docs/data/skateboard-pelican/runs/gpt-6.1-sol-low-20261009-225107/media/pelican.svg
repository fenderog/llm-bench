    <g stroke-width="2" fill="#f6edda"><circle cx="373" cy="759" r="3"/><circle cx="393" cy="759" r="3"/><circle cx="611" cy="759" r="3"/><circle cx="631" cy="759" r="3"/></g>
  </g>
  <g stroke="#203f48" stroke-width="5" stroke-linejoin="round" fill="#e8a44e">
    <path d="M436 738 Q447 733 456 741 L484 750 L455 758 L418 754Z"/>
    <path d="M562 720 Q572 714 581 722 L609 731 L581 739 L548 735Z"/>
    <path d="M451 743l4 15M576 724l5 15" fill="none" stroke-width="2"/>
  </g>
  <g fill="#203f48" font-family="Arial, Helvetica, sans-serif">
    <text x="67" y="923" font-size="15" letter-spacing="3">SALT AIR • SOFT WHEELS • NO WORRIES</text>
    <text x="932" y="923" text-anchor="end" font-size="15" font-weight="700" letter-spacing="2">EST. SUNNY DAYS</text>
