  </g>
  <path d="M74 744 Q270 702 451 742 T924 724" fill="none" stroke="#c8d3bc" stroke-width="3"/>
  <path d="M72 791 Q219 770 348 791" fill="none" stroke="#c8d3bc" stroke-width="3"/>
  <ellipse cx="496" cy="834" rx="291" ry="23" fill="#203f48" opacity=".12"/>
  <!-- speed marks -->
