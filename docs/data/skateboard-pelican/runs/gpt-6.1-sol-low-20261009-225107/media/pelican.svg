    <path d="M451 506 Q491 527 470 560 Q440 605 373 593 L316 571 Q351 572 362 561 L324 540 Q365 549 378 537 L353 518 Q390 530 408 518 Q429 499 451 506Z" fill="#e9efe6"/>
