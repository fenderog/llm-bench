    <path d="M351 589 Q403 635 468 616 Q525 598 545 556 Q561 574 544 608 Q506 659 437 652 Q370 649 351 589Z" fill="#d8e3db" stroke="none"/>
    <path d="M558 368 Q544 413 555 450" fill="none" stroke="#b2c7c5" stroke-width="4"/>
