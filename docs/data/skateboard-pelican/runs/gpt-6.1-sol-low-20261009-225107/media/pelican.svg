    <path d="M430 502 Q371 422 310 378 Q291 364 282 378 L322 426 Q261 389 249 410 Q238 425 300 473 Q239 444 232 465 Q229 486 312 530 L401 568" fill="#fffaf0"/>
    <path d="M317 446l46 42M302 477l42 26" fill="none" stroke="#b2c7c5" stroke-width="4"/>
