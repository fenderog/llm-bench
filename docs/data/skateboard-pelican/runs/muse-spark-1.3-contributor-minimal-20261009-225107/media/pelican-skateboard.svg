<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7EC8E3"/>
    <stop offset="0.65" stop-color="#BDE9F5"/>
    <stop offset="1" stop-color="#FFF3C4"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3EB6D3"/>
    <stop offset="1" stop-color="#1A7FA6"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.7" stop-color="#E8EEF2"/>
    <stop offset="1" stop-color="#C9D6DE"/>
  </linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F7FBFD"/>
    <stop offset="1" stop-color="#9FB3C0"/>
  </linearGradient>
  <linearGradient id="beakTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC44D"/>
    <stop offset="1" stop-color="#F0901A"/>
  </linearGradient>
  <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFB199"/>
    <stop offset="1" stop-color="#F27059"/>
  </linearGradient>
  <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF6B6B"/>
    <stop offset="0.5" stop-color="#EE3A5E"/>
    <stop offset="1" stop-color="#B81D4A"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF8D6"/>
    <stop offset="0.6" stop-color="#FFE27A"/>
    <stop offset="1" stop-color="#FFD23F" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- background -->
<rect width="800" height="600" fill="url(#sky)"/>
<circle cx="640" cy="110" r="90" fill="url(#sun)"/>
<circle cx="640" cy="110" r="48" fill="#FFDF5D" stroke="#F5A623" stroke-width="3"/>
<!-- clouds -->
<g fill="white" opacity="0.95">
  <ellipse cx="160" cy="110" rx="55" ry="22"/><ellipse cx="195" cy="100" rx="40" ry="20"/><ellipse cx="125" cy="100" rx="32" ry="16"/>
  <ellipse cx="420" cy="70" rx="45" ry="18"/><ellipse cx="450" cy="62" rx="30" ry="15"/>
</g>
<g font-family="sans-serif" font-size="22" opacity="0.9">
  <text x="310" y="95">﹏﹏</text><text x="90" y="160">﹏</text>
</g>
<!-- distant pelicans -->
<g fill="#3A5A6B" opacity="0.6">
  <path d="M500 90 q10 -8 20 0 q10 -8 20 0" stroke="#3A5A6B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M550 120 q8 -6 16 0 q8 -6 16 0" stroke="#3A5A6B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</g>

<!-- sea -->
<rect y="380" width="800" height="220" fill="url(#sea)"/>
<g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5" fill="none">
  <path d="M50 430 q20 -8 40 0 t40 0"/><path d="M620 470 q20 -8 40 0 t40 0"/><path d="M200 510 q20 -8 40 0 t40 0"/>
</g>

<!-- boardwalk -->
<rect y="400" width="800" height="110" fill="#D9A066"/>
<rect y="400" width="800" height="12" fill="#B67A3E"/>
<g stroke="#A5672F" stroke-width="2" opacity="0.6">
  <line x1="0" y1="430" x2="800" y2="430"/><line x1="0" y1="460" x2="800" y2="460"/><line x1="0" y1="488" x2="800" y2="488"/>
  <g>
    <line x1="60" y1="412" x2="60" y2="510"/><line x1="140" y1="412" x2="140" y2="510"/><line x1="220" y1="412" x2="220" y2="510"/><line x1="300" y1="412" x2="300" y2="510"/><line x1="380" y1="412" x2="380" y2="510"/><line x1="460" y1="412" x2="460" y2="510"/><line x1="540" y1="412" x2="540" y2="510"/><line x1="620" y1="412" x2="620" y2="510"/><line x1="700" y1="412" x2="700" y2="510"/><line x1="780" y1="412" x2="780" y2="510"/>
  </g>
</g>

<!-- motion lines -->
<g stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.7">
  <line x1="60" y1="330" x2="150" y2="330"/><line x1="40" y1="360" x2="180" y2="360"/><line x1="80" y1="390" x2="170" y2="390"/>
</g>

<!-- shadow -->
<ellipse cx="410" cy="523" rx="175" ry="14" fill="black" opacity="0.22"/>

<!-- skateboard -->
<g>
  <!-- wheels -->
  <g>
    <rect x="270" y="462" width="18" height="32" rx="5" fill="#555"/>
    <rect x="520" y="462" width="18" height="32" rx="5" fill="#555"/>
    <circle cx="279" cy="500" r="26" fill="#222"/><circle cx="279" cy="500" r="14" fill="#FFD23F"/><circle cx="279" cy="500" r="5" fill="#333"/>
    <circle cx="529" cy="500" r="26" fill="#222"/><circle cx="529" cy="500" r="14" fill="#FFD23F"/><circle cx="529" cy="500" r="5" fill="#333"/>
    <!-- sparkles on wheels -->
    <g stroke="#FFE27A" stroke-width="3" stroke-linecap="round">
      <line x1="245" y1="485" x2="235" y2="478"/><line x1="563" y1="485" x2="573" y2="478"/>
    </g>
  </g>
  <!-- deck -->
  <g transform="rotate(-3 400 460)">
    <rect x="200" y="440" width="410" height="28" rx="14" fill="url(#board)" stroke="#7A1030" stroke-width="3"/>
    <rect x="215" y="445" width="380" height="8" rx="4" fill="white" opacity="0.35"/>
    <g font-family="sans-serif" font-weight="900" font-size="18" fill="#FFE27A" opacity="0.95" text-anchor="middle">
      <text x="355" y="461">★ SURF ★</text>
    </g>
    <circle cx="225" cy="454" r="4" fill="silver"/><circle cx="585" cy="454" r="4" fill="silver"/>
  </g>
</g>

<!-- PELICAN -->
<g>
  <!-- tail -->
  <path d="M250 340 L195 315 L210 340 L190 350 L250 360 Z" fill="#8AA0B0" stroke="#5A7485" stroke-width="3" stroke-linejoin="round"/>
  <!-- legs / feet on board -->
  <g>
    <path d="M360 410 L355 445 L330 450" stroke="#F0901A" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M430 405 L435 443 L460 448" stroke="#F0901A" stroke-width="12" stroke-linecap="round" fill="none"/>
    <g fill="#FF9F1C" stroke="#B45A00" stroke-width="2.5">
      <ellipse cx="318" cy="452" rx="26" ry="10" />
      <ellipse cx="472" cy="450" rx="26" ry="10" />
      <path d="M300 448 l-12 6 M315 449 l-8 7 M450 446 l8 7 M465 446 l12 6" stroke="#B45A00" stroke-width="2"/>
    </g>
  </g>
  <!-- body -->
  <ellipse cx="380" cy="360" rx="130" ry="90" fill="url(#body)" stroke="#5A7485" stroke-width="4"/>
  <!-- wing (out for balance) -->
  <g transform="rotate(-18 380 350)">
    <path d="M360 300 C300 260 220 250 160 290 C210 295 200 310 170 330 C210 335 205 350 180 365 C230 370 300 370 370 350 Z" fill="url(#wing)" stroke="#5A7485" stroke-width="4" stroke-linejoin="round"/>
    <path d="M340 315 C290 295 240 295 200 310 M335 335 C295 325 250 325 210 338" stroke="#5A7485" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>
  <!-- scarf flowing -->
  <path d="M470 280 C520 270 570 280 610 260 C600 285 560 295 520 295 C550 300 580 315 590 335 C550 330 500 315 465 305 Z" fill="#00BBF9" stroke="#0077A6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M520 285 l30 -5 M515 298 l35 5" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- neck + head -->
  <path d="M460 330 C480 280 470 240 490 210" stroke="#E8EEF2" stroke-width="52" stroke-linecap="round" fill="none"/>
  <path d="M460 330 C480 280 470 240 490 210" stroke="url(#body)" stroke-width="44" stroke-linecap="round" fill="none"/>
  <circle cx="515" cy="190" r="48" fill="url(#body)" stroke="#5A7485" stroke-width="4"/>
  <!-- crest -->
  <path d="M480 155 C470 125 485 105 500 95 C505 115 510 125 515 135 C520 115 535 100 550 95 C545 115 535 135 525 148 Z" fill="white" stroke="#5A7485" stroke-width="3" stroke-linejoin="round"/>
  <!-- eye + sunglasses? cool eye -->
  <circle cx="528" cy="182" r="12" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="531" cy="183" r="6" fill="#222"/><circle cx="533" cy="181" r="2" fill="white"/>
  <path d="M510 165 q15 -10 32 -4" stroke="#5A7485" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- cheek blush -->
  <ellipse cx="505" cy="200" rx="10" ry="6" fill="#FF9AA2" opacity="0.7"/>

  <!-- BEAK long -->
  <path d="M555 175 L690 220 L560 225 Z" fill="url(#beakTop)" stroke="#B45A00" stroke-width="3" stroke-linejoin="round"/>
  <line x1="558" y1="198" x2="685" y2="219" stroke="#B45A00" stroke-width="2" opacity="0.6"/>
  <!-- pouch -->
  <path d="M560 225 L690 220 C680 260 640 295 600 295 C575 295 560 260 560 225 Z" fill="url(#pouch)" stroke="#A63A2A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M585 235 C610 250 640 250 665 232" stroke="#A63A2A" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- beak tip nail -->
  <path d="M690 220 l12 3 -10 10 z" fill="#B45A00"/>
</g>

<!-- title -->
<g font-family="Verdana, sans-serif" text-anchor="middle">
  <text x="400" y="570" font-size="32" font-weight="900" fill="white" stroke="#1A7FA6" stroke-width="6" paint-order="stroke">PELICAN SKATE CLUB</text>
  <text x="400" y="570" font-size="32" font-weight="900" fill="white">PELICAN SKATE CLUB</text>
</g>
</svg>