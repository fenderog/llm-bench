<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubik's Cube &mdash; Three.js</title>

    <div id="app"></div>

    <header class="hud">

      <p class="hint">Drag a face to turn it &middot; drag the background to orbit &middot; scroll to zoom</p>

      <button id="top" type="button">Top view</button>
