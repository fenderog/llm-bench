<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="Illustration of a warm cognac upholstered armchair with sculptural walnut arms">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dca376"/><stop offset=".47" stop-color="#bd724e"/><stop offset="1" stop-color="#884931"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4aa78"/><stop offset=".52" stop-color="#c58259"/><stop offset="1" stop-color="#a45d40"/></linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#e6ae7f"/><stop offset=".54" stop-color="#d28d60"/><stop offset="1" stop-color="#ae6042"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a5d37"/><stop offset=".32" stop-color="#74402b"/><stop offset=".72" stop-color="#532b23"/><stop offset="1" stop-color="#371e1d"/></linearGradient>
    <linearGradient id="woodLit" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#c18a56"/><stop offset=".3" stop-color="#9d643b"/><stop offset=".7" stop-color="#794329"/><stop offset="1" stop-color="#603224"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a55e3e"/><stop offset="1" stop-color="#683623"/></linearGradient>
    <filter id="shadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grain" width="74" height="87" patternUnits="userSpaceOnUse"><path d="M9 13l3 1m33 24 2 2M62 5l2 1M28 73l3 2M65 66l-2 2" fill="none" stroke="#47281d" stroke-opacity=".18" stroke-width="1.3"/><circle cx="15" cy="48" r="1" fill="#f6d3a4" opacity=".35"/><circle cx="53" cy="78" r="1" fill="#f6d3a4" opacity=".35"/></pattern>
  </defs>

  <!-- warm paper and a quiet architectural halo -->
  <rect width="1200" height="1200" fill="#f3eee4"/>
  <path d="M208 930V409c0-214 174-345 392-345s392 131 392 345v521" fill="#e8e0d2"/>
  <path d="M235 906V410c0-195 162-318 365-318s365 123 365 318v496" fill="none" stroke="#d6cbbb" stroke-width="2"/>
  <circle cx="829" cy="246" r="97" fill="#dfc49f" opacity=".57"/>
  <path d="M122 972H1078" stroke="#c9bcab" stroke-width="2"/>
  <ellipse cx="605" cy="987" rx="295" ry="37" fill="#5c4b3c" opacity=".18" filter="url(#shadow)"/>
  <ellipse cx="602" cy="995" rx="253" ry="14" fill="#a79a89" opacity=".17"/>

  <!-- rear feet, disappearing beneath the seat -->
  <path d="M414 708l-27 235q-2 17 11 22l13 3q13 1 17-14l54-199z" fill="url(#wood)" stroke="#462b23" stroke-width="4" stroke-linejoin="round"/>
  <path d="M749 706l91 217q7 16-5 23l-15 4q-12 1-18-12l-110-176z" fill="url(#wood)" stroke="#462b23" stroke-width="4" stroke-linejoin="round"/>
  <path d="M406 760l-11 177m328-182 107 174" fill="none" stroke="#ba8250" stroke-width="3" opacity=".48"/>

  <!-- shaped walnut back: outer shell, rim, and upholstered inset -->
  <path d="M341 328Q343 264 414 230Q545 169 696 218q83 26 113 87 11 22 5 58l-48 281q-5 36-49 51-129 46-285-8-45-16-53-53z" fill="url(#wood)" stroke="#3c251f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M353 326Q355 274 421 241q127-61 274-12 78 25 103 77 9 19 3 51l-48 281q-4 29-40 41-127 43-276-8-35-12-43-40z" fill="none" stroke="#bf895b" stroke-width="5" opacity=".78"/>
  <path d="M372 339q-3-51 57-80 117-57 258-12 69 22 90 68 9 18 2 48l-46 256q-4 27-34 37-118 39-251-8-30-10-36-37z" fill="url(#back)" stroke="#623925" stroke-width="5"/>
  <path d="M390 340q0-40 52-65 109-48 237-8 58 18 79 54 6 11 4 27-19-25-77-43-129-40-244 9-29 12-51 26z" fill="#f2c59a" opacity=".39"/>
  <path d="M387 366q-1 117 28 244c7 30 16 37 40 46q123 43 235 10" fill="none" stroke="#efbf90" stroke-width="4" opacity=".35"/>
  <path d="M763 357l-43 256q-4 19-25 27" fill="none" stroke="#713d2c" stroke-width="13" opacity=".18"/>
  <!-- inset seam and small irregular hand-drawn stitches -->
  <path d="M404 345q-1-42 49-62 102-43 222-5 62 19 74 55l-45 283q-112 41-264-10z" fill="none" stroke="#884d36" stroke-width="2.5" stroke-dasharray="3 7" opacity=".64"/>
  <path d="M485 290q103-27 199 12M423 430q2 87 18 140" fill="none" stroke="#f8d1a5" stroke-width="3" stroke-linecap="round" opacity=".36"/>
  <path d="M361 395l22 155m399-154-30 170" stroke="#d09562" stroke-width="3" fill="none" opacity=".58"/>

  <!-- rails that hold the seat -->
  <path d="M385 667q190-45 374-13l51 100q-192 68-424 24z" fill="url(#wood)" stroke="#3f251f" stroke-width="5"/>
  <path d="M391 749q215 49 406-10" fill="none" stroke="#c18b59" stroke-width="4" opacity=".65"/>

  <!-- plump cushion, top and the piping around its front edge -->
  <path d="M408 624q155-38 311-3 35 8 51 35l44 75q6 11-3 23l-20 28q-180 43-370 2l-53-29q-15-10-9-28l25-75q5-19 24-28z" fill="url(#edge)" stroke="#522e25" stroke-width="5"/>
  <path d="M395 646q11-28 46-34 140-29 267 1 39 9 56 39l46 73q-2 22-23 30-174 39-366 3-29-6-52-24z" fill="url(#seat)" stroke="#7c432f" stroke-width="5"/>
  <path d="M394 650q19 27 82 38 151 24 280-10" fill="none" stroke="#f4c79d" stroke-width="6" opacity=".42"/>
  <path d="M375 729q26 27 57 33 181 33 356-3" fill="none" stroke="#f0b686" stroke-width="4" opacity=".8"/>
  <path d="M418 777q183 39 368 3" fill="none" stroke="#442823" stroke-width="3" opacity=".6"/>
  <path d="M431 671q112 35 245 19" fill="none" stroke="#9c5c3c" stroke-width="2" opacity=".36"/>
  <path d="M369 727q83 18 199 23 143 7 241-24" fill="none" stroke="#f4d1a9" stroke-width="2" stroke-dasharray="2 8" opacity=".62"/>
  <path d="M395 646q11-28 46-34 140-29 267 1 39 9 56 39l46 73q-2 22-23 30-174 39-366 3-29-6-52-24z" fill="url(#grain)" opacity=".33"/>

  <!-- slim posts and front legs, tucked under each arm -->
  <path d="M352 690l-8 236q-1 14 12 19l16 3q14-1 17-16l38-187z" fill="url(#wood)" stroke="#41271f" stroke-width="5"/>
  <path d="M354 725l-2 197m27-173-10 174" fill="none" stroke="#b37b4f" stroke-width="3" opacity=".62"/>
  <path d="M778 684l32 246q2 14-11 18l-16 1q-13-2-16-17l-43-184z" fill="url(#wood)" stroke="#41271f" stroke-width="5"/>
  <path d="M778 729l20 195" fill="none" stroke="#b37b4f" stroke-width="3" opacity=".56"/>

  <!-- left arm: back mounting, curved wooden rail, rounded hand rest -->
  <path d="M376 484q-19-8-29 12l-59 168q-7 19 6 30l40 29q14 9 25-6l105-178-42-39z" fill="url(#wood)" stroke="#41271f" stroke-width="5"/>
  <path d="M378 489q-13-5-21 11l-53 155q-7 19 7 28l25 16q7 5 13-5l91-153-25-32z" fill="url(#woodLit)" stroke="#6a3826" stroke-width="3"/>
  <path d="M367 503q-10 43-36 101l-20 54q-4 11 4 16l18 12" fill="none" stroke="#dcad76" stroke-width="5" stroke-linecap="round" opacity=".67"/>
  <path d="M339 692q34-46 89-149" fill="none" stroke="#4c291f" stroke-width="3" opacity=".67"/>
  <path d="M316 681q8 5 19 10" fill="none" stroke="#f5cca0" stroke-width="2" opacity=".65"/>

  <!-- right arm: its upper edge sweeps toward the viewer -->
  <path d="M741 482q20-9 35 10 42 52 73 159 8 25-7 40l-31 29q-15 13-29-4l-99-169 25-51z" fill="url(#wood)" stroke="#3c251e" stroke-width="5"/>
  <path d="M746 488q15-5 26 11 41 54 68 153 5 16-4 25l-27 22q-9 6-16-5l-89-149 19-43z" fill="url(#woodLit)" stroke="#6a3928" stroke-width="3"/>
  <path d="M763 503q35 54 63 152 4 13-7 23" fill="none" stroke="#e4ae72" stroke-width="5" stroke-linecap="round" opacity=".68"/>
  <path d="M714 544q52 101 84 144" fill="none" stroke="#47261f" stroke-width="3" opacity=".53"/>
  <path d="M808 697l22-19" fill="none" stroke="#eac08a" stroke-width="2" opacity=".72"/>

  <!-- discreet maker's mark -->
  <g fill="#665e51" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="1060" font-size="24" letter-spacing="7">THE SUNDAY CHAIR</text>
    <text x="600" y="1090" font-size="12" letter-spacing="4">A PLACE TO PAUSE  ·  NO. 01</text>
  </g>
  <path d="M421 1072h-79m437 0h79" stroke="#bcb0a0" stroke-width="1.5"/>
</svg>
