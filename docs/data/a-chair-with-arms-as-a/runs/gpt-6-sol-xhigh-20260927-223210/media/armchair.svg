<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="title desc">
  <title id="title">The Armchair</title>
  <desc id="desc">A hand-drawn vector illustration of a terracotta upholstered wooden armchair with two curved arms, on a warm cream design-poster background.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d98660"/><stop offset=".52" stop-color="#ba6549"/><stop offset="1" stop-color="#8d493c"/></linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2=".72" y2="1"><stop stop-color="#e6a47a"/><stop offset=".55" stop-color="#cd7856"/><stop offset="1" stop-color="#aa5746"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76503b"/><stop offset=".48" stop-color="#51372e"/><stop offset="1" stop-color="#342b29"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a3764d"/><stop offset=".42" stop-color="#805437"/><stop offset="1" stop-color="#4e332b"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5c491"/><stop offset="1" stop-color="#c9865d"/></linearGradient>
    <pattern id="weave" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(34)"><path d="M0 0V12 M6 0V12" fill="none" stroke="#542e29" stroke-opacity=".11" stroke-width=".7"/></pattern>
    <clipPath id="backClip"><path d="M353 351 Q349 291 425 266 C498 242 673 236 753 257 Q839 280 843 355 L853 627 Q855 690 801 715 Q743 748 609 754 Q457 760 395 727 Q351 705 351 646 Z"/></clipPath>
