  <path d="M225 431 C265 414 302 439 326 482 C347 522 352 561 364 616 L349 683 C334 728 307 751 264 759 C217 744 190 716 183 669 L173 520 C171 477 187 449 225 431Z" fill="url(#armSide)" stroke="#303c36" stroke-width="5" stroke-linejoin="round"/>
  <path d="M740 431 C782 418 817 448 826 489 C830 508 829 527 827 545 L819 668 C813 716 786 746 738 759 C696 751 666 729 651 685 L638 617 C650 555 660 509 681 474 C698 449 714 439 740 431Z" fill="url(#armSide)" stroke="#303c36" stroke-width="5" stroke-linejoin="round"/>

  <!-- Seat rail, then its generously rounded cushion. -->
  <path d="M269 644 C379 660 632 661 739 644 L760 701 L754 729 C743 756 650 776 504 779 C360 778 271 758 256 729 L246 705Z" fill="#2e5549" stroke="#303a33" stroke-width="5" stroke-linejoin="round"/>
  <path d="M267 713 C363 745 640 747 746 712 L749 735 C722 760 628 774 502 775 C382 774 289 762 261 735Z" fill="#365f51"/>
  <path d="M287 736q76 28 218 27 139 0 222-28" fill="none" stroke="#8da48b" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>
  <path d="M319 573 C391 549 627 547 690 572 C717 599 735 646 745 680 C736 710 640 733 503 735 C371 734 282 710 270 680 C280 635 296 596 319 573Z" fill="url(#seat)" stroke="#2b5047" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#seatClip)">
    <path d="M257 552h500v194H257z" fill="url(#weave)"/>
    <path d="M307 586 Q405 557 529 561 Q637 560 683 580" fill="none" stroke="#d7debf" stroke-width="5" stroke-linecap="round" opacity=".3"/>
    <path d="M268 669 C344 700 448 708 509 708 C601 707 694 698 751 668 L765 743 L263 754Z" fill="#264f46" opacity=".22"/>
    <path d="M317 590 Q295 631 289 664 M690 587 Q720 637 726 660" fill="none" stroke="#e2e8ce" stroke-width="3" opacity=".23" stroke-linecap="round"/>
  </g>
  <path d="M274 682 C370 721 627 727 742 683" fill="none" stroke="#aec5a9" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M288 702 C381 736 625 739 725 703" fill="none" stroke="#21483f" stroke-width="4" stroke-linecap="round" opacity=".5"/>

  <!-- Rounded front faces and the pillowy tops of both arms. -->
  <path d="M187 521 C206 541 265 563 357 607 L343 677 C330 719 307 743 266 756 C227 744 199 713 192 666Z" fill="url(#armSide)" stroke="#2d4038" stroke-width="4" stroke-linejoin="round"/>
