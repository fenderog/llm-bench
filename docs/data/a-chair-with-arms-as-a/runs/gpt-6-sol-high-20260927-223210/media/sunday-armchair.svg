  <path d="M329 218 C313 240 300 281 303 341 L317 518 M680 218 C703 239 714 281 712 348" fill="none" stroke="#d0d8bc" stroke-width="3" opacity=".58" stroke-linecap="round"/>
  <g fill="#294b43" stroke="#b5c6ad" stroke-width="2">
    <circle cx="396" cy="332" r="9"/><circle cx="606" cy="332" r="9"/><circle cx="500" cy="449" r="9"/>
  </g>
  <g fill="#b0c2a9" opacity=".65"><circle cx="393" cy="328" r="2.2"/><circle cx="603" cy="328" r="2.2"/><circle cx="497" cy="445" r="2.2"/></g>

