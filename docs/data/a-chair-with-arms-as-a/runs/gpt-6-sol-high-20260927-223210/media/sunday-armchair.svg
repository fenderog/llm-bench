<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">The Sunday armchair</title>
  <desc id="desc">A hand-drawn illustration of a generously padded sage-green armchair with rounded arms, tufted back, and walnut legs, on a warm ivory background.</desc>
  <defs>
    <radialGradient id="paper" cx="48%" cy="40%" r="85%">
      <stop stop-color="#fbf8ef"/><stop offset="1" stop-color="#ede6d8"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2=".9" gradientUnits="objectBoundingBox">
      <stop stop-color="#739589"/><stop offset=".48" stop-color="#527768"/><stop offset="1" stop-color="#31584e"/>
    </linearGradient>
    <linearGradient id="seat" x1=".15" y1="0" x2=".65" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#86a496"/><stop offset=".5" stop-color="#638778"/><stop offset="1" stop-color="#3c6459"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#8da99b"/><stop offset=".52" stop-color="#5c8173"/><stop offset="1" stop-color="#3b6155"/>
    </linearGradient>
    <linearGradient id="armSide" x1="0" y1="0" x2=".9" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#55786b"/><stop offset="1" stop-color="#2c5147"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2=".4" gradientUnits="objectBoundingBox">
      <stop stop-color="#5e3b2d"/><stop offset=".48" stop-color="#a66b47"/><stop offset="1" stop-color="#57382c"/>
    </linearGradient>
    <pattern id="weave" width="11" height="11" patternUnits="userSpaceOnUse">
      <path d="M2 2l1 1m5 4l1 1" stroke="#e4e7d5" stroke-width="1" opacity=".27" stroke-linecap="round"/>
      <path d="M8 2l-1 1M3 8l-1 1" stroke="#183d38" stroke-width=".9" opacity=".16" stroke-linecap="round"/>
    </pattern>
    <clipPath id="backClip"><path d="M326 208 C402 164 607 167 684 208 C722 236 732 276 730 342 L716 553 C709 598 671 637 618 655 C563 671 420 674 374 651 C326 625 299 588 294 533 L280 344 C276 279 292 229 326 208Z"/></clipPath>
    <clipPath id="seatClip"><path d="M319 573 C391 549 627 547 690 572 C717 599 735 646 745 680 C736 710 640 733 503 735 C371 734 282 710 270 680 C280 635 296 596 319 573Z"/></clipPath>
    <filter id="groundBlur" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>

  <!-- Quiet paper and the round halo behind the drawing. -->
  <path fill="url(#paper)" d="M0 0h1000v1000H0z"/>
  <circle cx="501" cy="468" r="368" fill="#e6ddca" opacity=".39"/>
  <circle cx="501" cy="468" r="345" fill="none" stroke="#d0c4af" stroke-width="1.5" opacity=".54"/>
  <path d="M120 868c204 6 543 7 764 0" fill="none" stroke="#c9bda8" stroke-width="2" stroke-linecap="round" opacity=".68"/>
  <ellipse cx="504" cy="852" rx="284" ry="28" fill="#4b493f" opacity=".19" filter="url(#groundBlur)"/>
  <path d="M265 849c137 17 334 20 474 1" fill="none" stroke="#776e5c" stroke-width="3" opacity=".13" stroke-linecap="round"/>

  <!-- Splayed, polished walnut feet. -->
  <g stroke="#392f2a" stroke-width="4" stroke-linejoin="round">
    <path d="M294 709 Q320 705 353 725 L320 842 Q315 857 299 858 L275 850 Q269 847 271 837Z" fill="url(#wood)"/>
    <path d="M651 725 Q683 702 715 710 L738 837 Q742 849 733 852 L710 860 Q696 862 690 849Z" fill="url(#wood)"/>
