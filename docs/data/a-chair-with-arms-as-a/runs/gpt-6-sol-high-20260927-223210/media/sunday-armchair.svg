  <path d="M329 619q11 14 7 29m335-29q-11 13-7 29" fill="none" stroke="#1b4039" stroke-width="3" stroke-linecap="round" opacity=".4"/>

  <!-- A few hand-placed glints and seam stitches. -->
  <g fill="none" stroke="#d5dbc0" stroke-linecap="round" opacity=".65">
    <path d="M224 541l4 3m8 4 4 3m8 4 4 3m8 4 4 3m8 4 4 3m8 4 4 3" stroke-width="2"/>
    <path d="M778 546l-4 3m-8 4-4 3m-8 4-4 3m-8 4-4 3m-8 4-4 3" stroke-width="2"/>
