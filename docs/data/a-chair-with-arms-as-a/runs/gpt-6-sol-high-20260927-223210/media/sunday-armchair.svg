  <path d="M230 442 C264 428 298 448 318 488 C333 520 342 569 358 609 C332 594 312 588 281 574 C237 554 201 533 190 506 C182 482 198 456 230 442Z" fill="url(#arm)" stroke="#2f5048" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M743 442 C776 430 806 453 817 480 C828 509 806 539 763 559 C721 579 684 597 644 610 C657 563 665 521 680 487 C696 454 713 442 743 442Z" fill="url(#arm)" stroke="#2f5048" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M207 479 C230 446 260 447 282 467 M721 458 C753 439 786 456 800 483" fill="none" stroke="#d6dfc5" stroke-width="5" opacity=".53" stroke-linecap="round"/>
  <path d="M203 523 C235 551 291 578 346 601 M801 529 C771 553 702 583 660 600" fill="none" stroke="#b6cbaa" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
  <path d="M266 574 C280 628 281 703 266 743 M739 573 C722 631 724 700 739 744" fill="none" stroke="#a4baa1" stroke-width="3" stroke-linecap="round" opacity=".48"/>
