    <path d="M333 287 Q360 303 395 330 M429 260 Q407 291 395 330 M449 402 Q402 370 395 330 M483 372 Q440 336 395 330
             M680 290 Q642 304 607 332 M575 264 Q591 297 607 332 M554 403 Q592 365 607 332 M514 374 Q565 332 607 332
             M399 414 Q449 431 500 447 M602 414 Q552 431 500 447 M467 533 Q496 483 500 447 M541 540 Q507 489 500 447" fill="none" stroke="#244c43" stroke-width="4" stroke-linecap="round" opacity=".3"/>
    <path d="M356 299q15 13 27 20m244 1q18-15 34-20M445 423q24 8 43 14m26 0q21-8 42-13" fill="none" stroke="#c0d0b9" stroke-width="2.5" stroke-linecap="round" opacity=".39"/>
    <path d="M359 546q78 23 147 19 83-1 154-24" fill="none" stroke="#244b41" stroke-width="6" opacity=".22"/>
