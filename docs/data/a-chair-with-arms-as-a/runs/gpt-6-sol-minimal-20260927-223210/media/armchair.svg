<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <title>The reading chair</title>
  <desc>A hand-drawn, warm terracotta upholstered armchair with curved walnut arms and tapered legs.</desc>
  <defs>
    <radialGradient id="paper"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e9d7"/></radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c97858"/><stop offset=".54" stop-color="#ad583f"/><stop offset="1" stop-color="#813e32"/></linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#e09a70"/><stop offset=".55" stop-color="#be6c4d"/><stop offset="1" stop-color="#944934"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#a46a3e"/><stop offset=".45" stop-color="#794628"/><stop offset="1" stop-color="#4c2c22"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#c38a54"/><stop offset=".45" stop-color="#90552f"/><stop offset="1" stop-color="#583422"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <pattern id="grain" width="17" height="19" patternUnits="userSpaceOnUse"><path d="M2 3l1 1m10 8l1 1M7 17l1 1" stroke="#fff0d7" stroke-opacity=".2" stroke-width="1.3"/></pattern>
  </defs>
  <rect width="900" height="900" fill="url(#paper)"/>
  <!-- floor, and the chair's soft cast shadow -->
  <path d="M92 700 Q446 681 808 702" fill="none" stroke="#dccdb9" stroke-width="2" opacity=".65"/>
  <ellipse cx="468" cy="734" rx="282" ry="45" fill="#574437" opacity=".17" filter="url(#blur)"/>
  <ellipse cx="463" cy="738" rx="213" ry="20" fill="#6a4d3a" opacity=".09"/>
  <!-- rear legs -->
  <path d="M592 605 Q610 649 636 707 Q642 724 653 722 L664 716 Q657 679 630 583Z" fill="url(#wood)" stroke="#523525" stroke-width="4" stroke-linejoin="round"/>
  <path d="M293 596 Q280 649 258 711 Q254 726 267 729 L279 727 Q309 665 326 615Z" fill="url(#wood)" stroke="#523525" stroke-width="4" stroke-linejoin="round"/>
  <path d="M639 708l11 3m-392 9 16 2" stroke="#c79662" stroke-width="3" opacity=".65"/>
  <!-- upholstered back: outside silhouette -->
  <path d="M237 219 Q227 171 277 152 Q418 97 586 145 Q660 165 673 226 L665 497 Q651 552 602 577 L329 566 Q264 537 245 487Z" fill="#683d31" stroke="#48312b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M252 217 Q244 180 286 166 Q429 115 577 159 Q644 178 654 232 L646 474 Q626 512 588 535 L337 528 Q279 502 268 466Z" fill="url(#back)" stroke="#dc9a74" stroke-width="4"/>
  <path d="M280 190 Q409 144 558 180 Q618 193 626 241 M286 254 Q295 399 313 454" fill="none" stroke="#f3bc8e" stroke-width="5" opacity=".42" stroke-linecap="round"/>
  <path d="M638 253 Q637 378 628 461" fill="none" stroke="#63382f" stroke-width="6" opacity=".42"/>
  <!-- inset back cushion -->
  <path d="M296 225 Q319 185 438 185 Q560 179 610 223 Q630 251 610 416 Q601 465 558 482 Q451 510 348 474 Q312 461 305 421 Q287 304 296 225Z" fill="#d48864" stroke="#713f34" stroke-width="5"/>
  <path d="M312 232 Q337 200 439 201 Q553 195 590 233 Q606 258 591 400 Q587 451 550 463 Q448 492 354 457 Q328 448 322 412 Q307 299 312 232Z" fill="url(#back)"/>
  <path d="M326 236 Q362 209 434 213 M345 442 Q445 477 545 451" fill="none" stroke="#f2ae82" stroke-width="4" opacity=".55" stroke-linecap="round"/>
  <path d="M579 234 Q606 317 578 423" fill="none" stroke="#753e32" stroke-width="5" opacity=".48"/>
  <!-- cushion piped seam -->
  <path d="M304 231 Q297 298 311 416 Q313 455 349 471 Q445 506 556 478 Q608 465 615 412" fill="none" stroke="#f0ab80" stroke-width="3" opacity=".72"/>
  <!-- seat well -->
  <path d="M269 449 Q420 474 626 444 L679 529 Q675 592 632 622 Q464 667 283 606 Q229 584 231 526Z" fill="#663d31" stroke="#48312a" stroke-width="6"/>
  <path d="M282 476 Q420 489 623 465 L648 527 Q556 579 287 543Z" fill="#844634"/>
  <!-- seat cushion -->
  <path d="M275 472 Q362 456 460 466 Q566 459 630 477 Q661 492 657 536 L642 571 Q614 601 468 615 Q322 609 267 571 Q247 547 257 505 Q260 484 275 472Z" fill="#b46548" stroke="#6c3b30" stroke-width="6"/>
  <path d="M280 478 Q373 469 459 478 Q576 468 625 486 Q648 495 646 526 Q620 567 465 579 Q321 577 265 536 Q260 497 280 478Z" fill="url(#seat)" stroke="#edaa7d" stroke-width="3"/>
  <path d="M279 533 Q329 572 462 579 Q595 573 646 531" fill="none" stroke="#713b30" stroke-width="4" opacity=".65"/>
  <path d="M284 490 Q353 480 428 488 M558 486 Q600 483 621 498" stroke="#ffd0a0" stroke-width="4" opacity=".54" fill="none" stroke-linecap="round"/>
  <path d="M265 557 Q335 598 462 600 Q601 596 646 555" fill="none" stroke="#e69a70" stroke-width="3" opacity=".65"/>
  <!-- side rails and tapered front legs -->
  <path d="M263 558 Q253 582 263 610 Q299 647 353 650 L553 650 Q629 643 665 609 L661 575 Q619 621 464 626 Q313 622 263 558Z" fill="url(#wood)" stroke="#4b3027" stroke-width="6"/>
  <path d="M287 619 Q282 671 275 749 Q275 759 287 762 L302 757 Q319 692 335 641Z" fill="url(#wood)" stroke="#493026" stroke-width="5" stroke-linejoin="round"/>
  <path d="M602 635 Q620 687 633 748 Q636 759 648 758 L661 753 Q655 683 646 607Z" fill="url(#wood)" stroke="#493026" stroke-width="5" stroke-linejoin="round"/>
  <path d="M284 752q8 4 18 1m332-7q11 4 24 1" stroke="#dcaa71" stroke-width="3"/>
  <path d="M353 633 Q464 649 559 634" fill="none" stroke="#d0995d" stroke-width="4" opacity=".6"/>
  <!-- far arm upright and wooden handrest -->
  <path d="M609 446 Q624 424 645 432 Q675 440 685 470 L679 581 Q677 606 653 613 L632 604 L638 502Z" fill="url(#wood)" stroke="#4b3028" stroke-width="6"/>
  <path d="M597 445 Q622 416 649 420 Q690 424 705 454 Q711 472 695 482 Q677 487 657 471 Q645 462 626 473 L611 482 Q587 477 597 445Z" fill="url(#arm)" stroke="#503124" stroke-width="6" stroke-linejoin="round"/>
  <path d="M611 445 Q638 421 665 438 Q678 444 686 453" fill="none" stroke="#e5aa6b" stroke-width="5" opacity=".78" stroke-linecap="round"/>
  <!-- near arm support, its shape sits forward of cushion -->
  <path d="M220 459 Q241 439 266 453 L295 576 Q305 601 327 614 L311 636 Q258 625 238 590 Q215 534 220 459Z" fill="url(#wood)" stroke="#4d3027" stroke-width="6" stroke-linejoin="round"/>
  <path d="M200 471 Q201 446 222 435 Q245 421 267 439 Q286 458 294 488 Q298 506 283 514 Q267 517 253 499 Q241 485 229 493 Q213 500 200 487 Q194 481 200 471Z" fill="url(#arm)" stroke="#4d3027" stroke-width="6" stroke-linejoin="round"/>
  <path d="M207 466 Q222 439 244 446 Q263 452 276 479" fill="none" stroke="#e6af76" stroke-width="5" opacity=".85" stroke-linecap="round"/>
  <path d="M233 509 Q236 560 260 589" fill="none" stroke="#bd8150" stroke-width="3" opacity=".65"/>
  <!-- restrained speckled textile texture, clipped to the upholstery -->
  <path d="M312 232 Q337 200 439 201 Q553 195 590 233 Q606 258 591 400 Q587 451 550 463 Q448 492 354 457 Q328 448 322 412 Q307 299 312 232Z M280 478 Q373 469 459 478 Q576 468 625 486 Q648 495 646 526 Q620 567 465 579 Q321 577 265 536 Q260 497 280 478Z" fill="url(#grain)" opacity=".8"/>
  <!-- tiny signature-like flourish -->
  <path d="M690 785q11-17 18-5 4 8 11-5 5-6 9 1 4 7 12-2m-48 13h53" fill="none" stroke="#9e7a5f" stroke-width="2" stroke-linecap="round" opacity=".65"/>
</svg>
