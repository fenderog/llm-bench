[project]
name = "bench"
version = "0.1.0"
description = "Publish LLM benchmark runs (Godot web builds + agent sessions) to a GitHub Pages site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bench = "bench:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
