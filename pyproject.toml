[project]
name = "art-crit"
version = "0.1.0"
description = "A crit for LLMs: compare what models make for visual and spatial prompts, side by side, on a GitHub Pages site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
verify = ["playwright>=1.63.0"]

[project.scripts]
art-crit = "art_crit:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
